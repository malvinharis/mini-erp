name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json's `packageManager` field — pinning
      # it here too causes "Multiple versions of pnpm specified"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile=false

      - name: Prisma generate + validate
        run: |
          pnpm --filter @mini-erp/api prisma:generate
          pnpm --filter @mini-erp/api exec prisma validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit --audit-level=high || true
